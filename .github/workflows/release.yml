name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux x86_64 native build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check .
      - run: uv run mypy src/agent2pieces
      - run: uv run pytest tests/acceptance tests/integration tests/unit
      - run: uv run pytest tests/browser
      - run: uv run python scripts/validate_release_workflow.py
      - name: Install isolated release dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/agent2pieces-release
        run: uv sync --frozen --no-default-groups --group build
      - name: Build native release artifact
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/agent2pieces-release
        run: uv run --frozen --no-sync python scripts/build_native.py --clean
      - run: uv run pytest tests/acceptance/test_packaged_binary.py --artifact-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent2pieces-linux-x86_64
          if-no-files-found: error
          path: |
            dist/agent2pieces-v*-linux-x86_64.tar.gz
            dist/agent2pieces-v*-linux-x86_64.tar.gz.sha256

  build-windows:
    name: Windows x86_64 native build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Verify Windows source confinement
        run: >-
          uv run pytest
          tests/unit/test_scanners.py
          tests/integration/test_scan_service.py
          tests/acceptance/test_source_safety.py
      - run: uv run python scripts/validate_release_workflow.py
      - name: Install isolated release dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/agent2pieces-release
        run: uv sync --frozen --no-default-groups --group build
      - name: Build native release artifact
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/agent2pieces-release
        run: uv run --frozen --no-sync python scripts/build_native.py --clean
      - run: uv run pytest tests/acceptance/test_packaged_binary.py --artifact-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent2pieces-windows-x86_64
          if-no-files-found: error
          path: |
            dist/agent2pieces-v*-windows-x86_64.zip
            dist/agent2pieces-v*-windows-x86_64.zip.sha256

  build-macos:
    name: macOS arm64 native build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/validate_release_workflow.py
      - name: Install isolated release dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/agent2pieces-release
        run: uv sync --frozen --no-default-groups --group build
      - name: Build native release artifact
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/agent2pieces-release
        run: uv run --frozen --no-sync python scripts/build_native.py --clean
      - run: uv run pytest tests/acceptance/test_packaged_binary.py --artifact-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent2pieces-macos-arm64
          if-no-files-found: error
          path: |
            dist/agent2pieces-v*-macos-arm64.tar.gz
            dist/agent2pieces-v*-macos-arm64.tar.gz.sha256

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        run: python scripts/validate_release_workflow.py --release-tag "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish immutable archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes
